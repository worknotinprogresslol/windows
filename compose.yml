services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "https://mirror.clarkson.edu/linuxmint-images/stable/22.3/linuxmint-22.3-cinnamon-64bit.iso"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows:/storage
    restart: always
    stop_grace_period: 2m
